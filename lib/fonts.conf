<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- All font paths are relative to this file, so the slug can move. -->
  <dir prefix="relative">../../root/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <!-- Use the OpenType copies of URW fonts. Legacy Type 1 copies can
       cause Qt to substitute a different family during PDF rendering. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="fontformat"><string>Type 1</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
